selfRegistration.step.create.user.info=Bevor Sie auf die Forschungsdaten der Restriktionsstufe \u201Enur f\u00FCr angemeldete Nutzer\u201C zugreifen k\u00F6nnen, ben\u00F6tigen Sie eine Nutzerkennung mit Leser-Rechten. Sie k\u00F6nnen sich \u00FCber das unten stehende Formular selbst registrieren. Um die Registrierung abzuschlie\u00DFen, m\u00FCssen Sie einmal den Link aufrufen, der Ihnen per Mail zugesandt wird, nachdem Sie das Formular abgesandt haben. Vielen Dank!

